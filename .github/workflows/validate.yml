name: Validate Config

on:
  push:
    branches: [dev]

jobs:
  config-contracts:
    name: Cross-platform config and distribution contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate JSON files
        run: |
          echo "=== Validating JSON files ==="
          errors=0
          for f in hooks/hooks.json skills/global/skill-rules.json .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json .agents/plugins/marketplace.json plugin-assets/claude-code-plugin/.claude-plugin/plugin.json plugin-assets/codex-plugin/.codex-plugin/plugin.json plugin-assets/codex-plugin/.mcp.json app-adapters/claude-desktop/goldband-local-extension/manifest.json app-adapters/claude-remote/goldband-connector.template.json docs/reports/plugin-expected-assets.json docs/reports/app-support-expected-assets.json; do
            if [ -f "$f" ]; then
              if python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
                echo "  [OK] $f"
              else
                echo "  [ERROR] $f — invalid JSON"
                errors=$((errors + 1))
              fi
            else
              echo "  [ERROR] $f — required file not found"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::$errors JSON file(s) have syntax errors"
            exit 1
          fi
      - name: Check skills
        run: bash scripts/check-skills.sh
      - name: Check Codex portable baseline
        run: bash scripts/check-codex-portability.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Check generated capability surfaces
        run: npm run check:manifest
      - name: Check review contract freshness
        run: npm run check:review-contracts
      - name: Test capability invocation validation
        run: npm run test:capability-invocations
      - name: Test thin workflow contracts
        run: npm run test:workflow-contracts
      - name: Check coding style gate
        run: node scripts/check-code-style.mjs
      - name: Check plugin distribution artifacts are fresh
        run: node scripts/sync-plugin-assets.mjs --check
      - name: Check app support artifacts are fresh
        run: node scripts/sync-app-support-assets.mjs --check
      - name: Verify hook script references
        run: python3 scripts/verify-hook-script-references.py
      - name: Verify decision guidance parity
        run: bash scripts/verify-decision-guidance.sh
      - name: Check Goldband Loop source quality
        env:
          GOLDBAND_COMPLEXITY_BASE_REF: ${{ github.event.before }}
        run: cd goldband-loop && bun run check:source

  config-runtime-integrations:
    name: Cross-platform config runtime integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Install workflow CLI prerequisites
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex
      - name: Test app support adapters
        run: npm run test:app-support
      - name: Test plugin distribution with Claude Code CLI
        run: npm run test:plugin-distribution
      - name: Test coding style gate
        run: npm run test:style-gate
      - name: Test project style gate
        run: npm run test:project-style-gate
      - name: Test Codex portable baseline gate
        run: npm run test:codex-portability
      - name: Replay hook router golden dataset
        run: npm run test:hook-router
      - name: Test telemetry schema and OTLP exporter
        run: npm run test:telemetry
      - name: Check hook router coverage matrix
        run: npm run test:hook-router:coverage
      - name: Test eval budget cap checker
        run: npm run test:eval-budget-cap
      - name: Test auto-update installer refresh
        run: npm run test:auto-update
      - name: Test goldband MCP server
        run: |
          npm ci --prefix mcp/server
          npm run test:mcp-server
          npm run smoke:mcp-server

  linux-loop:
    name: Linux Loop and Bubblewrap contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install workflow CLI prerequisites
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Install managed worktree Linux boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test managed worktree Bubblewrap enforcement on Linux
        run: cd goldband-loop && bun test test/managed-worktree.test.ts
        env:
          GOLDBAND_REQUIRE_LIVE_BOUNDARY: "1"
      - name: Check Goldband Loop inventory
        run: node scripts/check-goldband-loop-inventory.mjs
      - name: Show Linux workflow test ownership
        run: cd goldband-loop && bun run scripts/test-workflows.ts --list
      - name: Test Linux-supported Goldband Loop workflow runtime
        run: cd goldband-loop && bun run test:workflows

  linux-free-suite:
    name: Linux free suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install workflow CLI prerequisites
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Install managed worktree Linux boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap xvfb x11-utils
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Goldband Loop Playwright browser
        run: cd goldband-loop && bunx playwright install --with-deps chromium
      - name: Show Linux free-suite ownership
        run: cd goldband-loop && bun run scripts/test-free-shards.ts --list
      - name: Test Goldband Loop free suite on Linux
        run: cd goldband-loop && bun run test:free

  linux-playwright-integration:
    name: Linux Playwright integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Test Goldband Loop Playwright setup behavior
        run: bash scripts/test-goldband-loop-playwright-setup.sh
      - name: Install Goldband Loop Playwright browser
        run: cd goldband-loop && bunx playwright install --with-deps chromium

  linux-workflow-installer:
    name: Linux workflow installer integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci
      - name: Install workflow CLI prerequisites
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Test workflow installer integration on Linux
        run: bash scripts/test-workflow-integration.sh

  linux-sandbox-container:
    name: Linux sandbox container integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx for sandbox cache
        uses: docker/setup-buildx-action@v3
      - name: Test sandbox container
        env:
          GOLDBAND_SANDBOX_USE_BUILDX: "1"
        run: bash scripts/test-sandbox.sh

  macos-review-host:
    name: macOS Seatbelt review evidence contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Python review runtime prerequisites
        run: brew install python@3.14 uv
      - name: Install Codex CLI for execpolicy contract tests
        run: npm install -g @openai/codex
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Review evidence - review-evidence-tests
        run: bun test --cwd goldband-loop test/review-evidence.test.ts test/review-evidence-platform.test.ts
        env:
          GOLDBAND_REQUIRE_REVIEW_HOST_BOUNDARY: "1"
      - name: Review evidence - work-map-review-tests
        run: bun test --cwd goldband-loop test/work-map-review.test.ts
        env:
          GOLDBAND_REQUIRE_REVIEW_HOST_BOUNDARY: "1"
      - name: Review evidence - installed-runtime-tests
        run: bun test --cwd goldband-loop test/codex-review-launcher-install.test.ts test/review-receipt-authority-install.test.ts
        env:
          GOLDBAND_REQUIRE_REVIEW_HOST_BOUNDARY: "1"
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Test managed worktree Seatbelt enforcement on macOS
        run: cd goldband-loop && bun test test/managed-worktree.test.ts
        env:
          GOLDBAND_REQUIRE_LIVE_BOUNDARY: "1"
      - name: Show macOS workflow test ownership
        run: cd goldband-loop && bun run scripts/test-workflows.ts --list
      - name: Test Goldband Loop workflow runtime on the macOS review host
        run: cd goldband-loop && bun run test:workflows
        env:
          GOLDBAND_REQUIRE_REVIEW_HOST_BOUNDARY: "1"

  macos-free-suite:
    name: macOS free suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Python review runtime prerequisites
        run: brew install python@3.14 uv
      - name: Install Codex CLI for execpolicy contract tests
        run: npm install -g @openai/codex
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Install Goldband Loop Playwright browser on macOS
        run: cd goldband-loop && bunx playwright install chromium
      - name: Show macOS free-suite ownership
        run: cd goldband-loop && bun run scripts/test-free-shards.ts --list
      - name: Test Goldband Loop free suite on macOS
        run: cd goldband-loop && bun run test:free
        env:
          GOLDBAND_REQUIRE_REVIEW_HOST_BOUNDARY: "1"

  macos-pty-integration:
    name: macOS PTY and WebSocket integration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Test terminal PTY and WebSocket runtime on macOS
        run: cd goldband-loop && bun test browse/test/terminal-agent-integration.test.ts --max-concurrency=1 --timeout=30000

  macos-playwright-integration:
    name: macOS Playwright integration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Test Goldband Loop Playwright setup behavior on macOS
        run: bash scripts/test-goldband-loop-playwright-setup.sh
      - name: Install Goldband Loop Playwright browser on macOS
        run: cd goldband-loop && bunx playwright install chromium

  macos-workflow-installer:
    name: macOS workflow installer integration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Codex CLI for execpolicy contract tests
        run: npm install -g @openai/codex
      - name: Show Bash version
        run: bash --version
      - name: Install Goldband Loop dependencies
        run: cd goldband-loop && bun install --frozen-lockfile
      - name: Build installer-owned Goldband Loop artifacts
        run: cd goldband-loop && bun run build
      - name: Test workflow installer integration on macOS Bash
        run: bash scripts/test-workflow-integration.sh
