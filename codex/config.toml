# goldband Codex global defaults
#
# Initial defaults only: existing user config files are never merged on update.
# shell_environment_policy is a recommendation, not a managed requirement.
# Rules, hooks, and explicitly installed requirements have separate ownership.
# Put long-form behavior and workflow guidance in AGENTS.md.

sandbox_mode = "workspace-write"
approval_policy = "on-request"
personality = "pragmatic"
web_search = "cached"

# Let Codex reuse CLAUDE.md in repositories that already standardize on it.
project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[shell_environment_policy]
inherit = "core"
exclude = ["*_SECRET", "*_KEY", "*_TOKEN", "*_PASSWORD", "*_CREDENTIAL"]

[tui]
notifications = true
notification_method = "auto"

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

[history]
persistence = "save-all"

[features]
memories = true
shell_tool = true

[otel]
exporter = "none"
log_user_prompt = false

[agents]
max_threads = 6
max_depth = 1

[agents.reviewer]
description = "Focused code review agent for correctness, security, maintainability, and missing-test risks."
config_file = "agents/reviewer.toml"

[agents.explorer]
description = "Read-heavy codebase exploration agent for mapping files, contracts, and current behavior without edits."
config_file = "agents/explorer.toml"

[agents.planner]
description = "Planning agent for turning researched scope into phased, verifiable implementation tasks."
config_file = "agents/planner.toml"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
